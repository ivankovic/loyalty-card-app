# nginx for tests/container.rs: plain HTTP in front of the app, with the headers the server's
# nginx sends. The server's own configuration, with TLS, is packaging/nginx/loyalty.conf.
server {
    listen 80;
    client_max_body_size 4m;
    location / {
        proxy_pass http://loyalty:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
