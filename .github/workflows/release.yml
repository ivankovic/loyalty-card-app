name: Release

# A tag v<version> on main publishes the release: the image for amd64 and arm64 on GHCR, and a
# GitHub release whose notes are the version's section of CHANGELOG.md. The steps before the tag
# are in CONTRIBUTING.md, "Releasing".
#
# Each architecture builds on its own kind of runner, because compiling Rust under emulation
# takes an hour. Each pushes a tag of its own (0.1.0-amd64, 0.1.0-arm64); the last job joins them
# under 0.1.0, 0.1 and latest.

on:
  push:
    tags: ["v*"]

env:
  BUN_VERSION: 1.3.14
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  # The tag, Cargo.toml, web/package.json and a dated CHANGELOG section must all agree.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run scripts/check-versions.ts --release
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag is $GITHUB_REF_NAME but Cargo.toml says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    needs: check
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -f packaging/docker/Dockerfile \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$VERSION-${{ matrix.arch }}" .
          docker push "$IMAGE:$VERSION-${{ matrix.arch }}"
        env:
          VERSION: ${{ needs.check.outputs.version }}

  publish:
    needs: [check, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Before 1.0 a minor version may change the command line, so 0.1 follows patches only.
      - run: |
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" -t "$IMAGE:${VERSION%.*}" -t "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
        env:
          VERSION: ${{ needs.check.outputs.version }}
      - run: |
          awk -v head="## [$VERSION]" \
            'index($0, head) == 1 { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md > notes.md
          printf '\nThe image, for amd64 and arm64: `%s:%s`. To run it: [packaging/README.md](%s).\n' \
            "$IMAGE" "$VERSION" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/packaging/README.md" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          VERSION: ${{ needs.check.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
