name: CI

# Every job's steps are what `make ci` runs locally; a red job here reproduces there.

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because two jobs go red without anything here changing: `audit` when an advisory is
  # published against a dependency, and `rust` when a new stable lands a lint.
  schedule:
    - cron: "23 5 * * 1"

env:
  CARGO_TERM_COLOR: always
  # Pinned, like every action below: the same Bun as `engines` in web/package.json and as the
  # Dockerfile, so that a new release changes nothing until it is chosen.
  BUN_VERSION: 1.4.4

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo nextest run --locked
      # The floor and why it is not the measured figure: CONTRIBUTING.md, "Coverage".
      - run: cargo llvm-cov nextest --locked --fail-under-lines 90 --summary-only

  # No allow-list: an advisory with a patched version is fixed by updating, not ignored.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit
      - run: cargo audit --deny unsound --deny yanked

  # Must equal `rust-version` in Cargo.toml.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --all-targets --locked

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run lint
        working-directory: web
      - run: bun run typecheck
        working-directory: web
      - run: bun test src
        working-directory: web
      - run: bun run build
        working-directory: web

  # Licence headers, versions, and the third-party notices against Cargo.lock and bun.lock.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-about
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: make check-headers check-versions check-third-party-notices

  # The server, with the app built into it, once for the three e2e shards; with the Bun that
  # built it, because the shards' image has no unzip for setup-bun.
  e2e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile && bun run build
        working-directory: web
      - run: cargo build --locked --bin loyalty
      - run: mkdir e2e-bin && cp target/debug/loyalty "$(command -v bun)" e2e-bin/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-bin
          path: e2e-bin/
          retention-days: 1

  # The real server, the built app, Chromium and WebKit; three shards, all run to the end.
  # Playwright's image has the browsers and every library they need, so a run installs nothing
  # from apt, whose mirror once took half an hour over it. Its version must be the `playwright`
  # in web/package.json (`make check-versions`).
  e2e:
    needs: e2e-build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-bin
          path: e2e-bin
      # An artifact keeps no file modes.
      - run: |
          install -D -m 755 e2e-bin/loyalty target/debug/loyalty
          install -m 755 e2e-bin/bun /usr/local/bin/bun
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run e2e
        working-directory: web
        env:
          E2E_PREBUILT: "1"
          E2E_SHARD: ${{ matrix.shard }}
          E2E_BROWSERS: chromium,webkit

  # The image behind a real nginx.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --test container
        env:
          LOYALTY_CONTAINER_TESTS: "1"
          LOYALTY_CONTAINER_ENGINE: docker
