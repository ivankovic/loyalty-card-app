# cargo-about's settings for THIRD-PARTY-NOTICES.md: the licences the crates built into the
# binary may have. A crate under any other licence fails `make third-party-notices`, which is
# the point: a new licence is a decision, not a side effect of adding a dependency.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "WTFPL",
    "Zlib",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

[loyalty-card-app]
accepted = ["AGPL-3.0-only"]
