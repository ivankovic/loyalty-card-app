# The app behind nginx, on its own name. Copy into nginx's conf.d and adjust the marked lines.
# The TLS certificate must cover the name; nothing else here is specific to one server.
server {
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/cards.example.org/fullchain.pem;      # <-
    ssl_certificate_key /etc/letsencrypt/live/cards.example.org/privkey.pem;    # <-
    server_name cards.example.org;                                              # <-

    # Photos are at most 2 MB; a little over, so that nginx is not what refuses one.
    client_max_body_size 4m;

    # Looked up when a request comes (Docker's DNS), so that nginx starts while the app is down.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $loyalty http://loyalty:8080;

    # The app sets its own security headers (CSP, camera permission); HSTS is nginx's.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass $loyalty;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # An invite link carries its secret: these requests are not logged.
    location ~ ^/(i|api/invite)/ {
        access_log off;
        proxy_pass $loyalty;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Optional, a second wall: only devices with a certificate from your Friends and Family CA
    # reach the app at all. A home-screen app on an iPhone presents a certificate less reliably
    # than Safari does; try it on every phone before relying on it.
    #
    # BEGIN ffca
    # ssl_client_certificate /etc/nginx/certs/ffca-ca.pem;
    # ssl_verify_client on;
    # END ffca
}
