# The app, as a service for a docker-compose.yml that already runs nginx. Copy it under
# `services:` and adjust the marked lines - see packaging/README.md.
  loyalty:
    image: ghcr.io/ivankovic/loyalty-card-app:0.1          # the newest 0.1.x; a change to the
                                                           # command line waits for 0.2
    # To build from a checkout instead, replace the line above with these:
    # build:
    #   context: /path/to/loyalty-card-app                 # <- your checkout
    #   dockerfile: packaging/docker/Dockerfile
    # image: loyalty-card-app
    container_name: loyalty                                # nginx reaches it as http://loyalty:8080
    init: true                                             # stops at once when told to: the
                                                           # server is the container's first process
    mem_limit: 128m
    pids_limit: 64
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"                                    # owns the data folder below
    environment:
      LOYALTY_ORIGIN: https://cards.example.org            # <- where people open it
      LOYALTY_TRUST_PROXY: "true"                          # nginx sets X-Real-IP
    volumes:
      - /srv/loyalty:/data                                 # <- the database; owned by 65534
    healthcheck:
      test: ["CMD", "/loyalty", "healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - gateway                                            # <- a network only nginx shares with it
